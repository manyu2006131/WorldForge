name: WorldForge
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  WorldForge:
    type: application
    platform: iOS
    sources:
      - App.swift
      - path: Generated/WorldForge.html
        buildPhase: resources
      - path: Generated/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manyu2006131.worldforge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
schemes:
  WorldForge:
    build:
      targets:
        WorldForge: all
